name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_VERSION: "17"

jobs:
  # Build and test shared module
  shared:
    name: Build Shared Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build shared module
        run: ./gradlew :shared:build

      - name: Run shared tests
        run: ./gradlew :shared:allTests

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-results
          path: shared/build/reports/tests/
          retention-days: 7

  # Build Android app
  android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

  # Build Desktop app (Linux)
  desktop-linux:
    name: Build Desktop (Linux)
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Desktop App
        run: ./gradlew :desktopApp:packageDeb

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          retention-days: 14

  # Build Desktop app (Windows)
  desktop-windows:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    needs: shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Desktop App
        run: ./gradlew :desktopApp:packageMsi

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 14

  # Build Desktop app (macOS)
  desktop-macos:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    needs: shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Desktop App
        run: ./gradlew :desktopApp:packageDmg

      - name: Upload macOS Package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 14

  # Build Web app
  web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Web App
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: webApp/build/dist/js/productionExecutable/
          retention-days: 14

  # Build iOS app
  ios:
    name: Build iOS
    runs-on: macos-latest
    needs: shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build iOS Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App (Simulator)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || echo "iOS build skipped - Xcode project may need setup"

  # Code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Run Kotlin Lint
        run: ./gradlew :shared:lintKotlin || echo "Lint not configured"

      - name: Check Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3
