name: Deploy Web

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'webApp/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: "17"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Web App
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Copy index.html to dist
        run: |
          cp webApp/src/jsMain/resources/index.html webApp/build/dist/js/productionExecutable/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/js/productionExecutable/

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
