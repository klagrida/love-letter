name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  JAVA_VERSION: "17"

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build DEB package
        run: ./gradlew :desktopApp:packageDeb

      - name: Build RPM package
        run: ./gradlew :desktopApp:packageRpm || echo "RPM build skipped"

      - name: Get version name
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp desktopApp/build/compose/binaries/main/deb/*.deb release/ || true
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm release/ || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.VERSION }}
          path: release/
          retention-days: 90

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build MSI package
        run: ./gradlew :desktopApp:packageMsi

      - name: Build EXE package
        run: ./gradlew :desktopApp:packageExe || echo "EXE build skipped"

      - name: Get version name
        id: version
        shell: bash
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p release
          cp desktopApp/build/compose/binaries/main/msi/*.msi release/ || true
          cp desktopApp/build/compose/binaries/main/exe/*.exe release/ || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.VERSION }}
          path: release/
          retention-days: 90

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build DMG package
        run: ./gradlew :desktopApp:packageDmg

      - name: Get version name
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg release/ || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ steps.version.outputs.VERSION }}
          path: release/
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Get version name
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux-${{ steps.version.outputs.VERSION }}
          path: release/linux/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ steps.version.outputs.VERSION }}
          path: release/windows/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-${{ steps.version.outputs.VERSION }}
          path: release/macos/

      - name: Prepare release files
        run: |
          mkdir -p final
          cp release/linux/* final/ || true
          cp release/windows/* final/ || true
          cp release/macos/* final/ || true
          ls -la final/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: final/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
